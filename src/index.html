<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-Rapor Tengah Semester</title>
  <link href="./css/output.css" rel="stylesheet">
  <!-- Load Lucide offline from node_modules -->
  <script src="../node_modules/lucide/dist/umd/lucide.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen overflow-hidden flex">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col h-full shadow-lg z-10">
    <div class="p-6 flex items-center gap-3 border-b border-slate-800">
      <i data-lucide="graduation-cap" class="text-blue-400 w-8 h-8"></i>
      <h1 class="text-xl font-bold tracking-tight text-blue-50">e-Rapor</h1>
    </div>
    
    <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto">
      <a href="#" id="nav-dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
      </a>
      <a href="#" id="nav-students" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
        <i data-lucide="users" class="w-5 h-5"></i> Siswa
      </a>
      <a href="#" id="nav-subjects" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
        <i data-lucide="book-open" class="w-5 h-5"></i> Mata Pelajaran
      </a>
      <a href="#" id="nav-scores" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
        <i data-lucide="file-spreadsheet" class="w-5 h-5"></i> Input Nilai
      </a>
      <!-- Placeholder for Kehadiran Menu (will add later) -->
      <a href="#" id="nav-attendance" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
        <i data-lucide="calendar-check" class="w-5 h-5"></i> Kehadiran
      </a>
      <a href="#" id="nav-leger" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
        <i data-lucide="table-properties" class="w-5 h-5"></i> Leger Nilai
      </a>
      <a href="#" id="nav-print" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
        <i data-lucide="printer" class="w-5 h-5"></i> Cetak Rapor
      </a>
    </nav>
    
    <div class="p-4 border-t border-slate-800">
      <a href="#" id="nav-settings" class="flex items-center gap-3 px-3 py-2.5 rounded-md hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
        <i data-lucide="settings" class="w-5 h-5"></i> Pengaturan
      </a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50">
    <!-- Topbar for context -->
    <header class="bg-white border-b border-gray-200 h-16 flex items-center px-6 justify-between no-print">
      <h2 id="topbar-title" class="text-xl font-semibold text-gray-800">Dashboard</h2>
      <div class="flex items-center gap-2 text-sm text-gray-500">
        <i data-lucide="calendar" class="w-4 h-4"></i>
        <span id="topbar-school-info">Belum disetup</span>
      </div>
    </header>
    
    <!-- Dynamic Content -->
    <div class="p-6 overflow-y-auto flex-1" id="main-content">
      <div class="bg-white p-8 rounded-lg shadow-sm text-center">
        <i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto text-blue-600 mb-4"></i>
        <p class="text-gray-600">Memuat aplikasi...</p>
      </div>
    </div>
  </main>
  
  <!-- Global In-App Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Global In-App Modal Container -->
  <div id="modal-container" class="relative z-50"></div>

  <script src="./js/curriculum-data.js"></script>
  <script src="./js/renderer.js"></script>
  <script>
    // Initialize Lucide icons globally
    const initLucide = () => {
      try {
        lucide.createIcons();
      } catch (err) {
        console.error('Error creating lucide icons:', err);
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLucide);
    } else {
      initLucide();
    }
  </script>
</body>
</html>
